    <script>
      (function () {
        try {
          var root = document.documentElement;
          var mode = localStorage.getItem('mode');
          if (['light', 'mixed', 'dark'].includes(mode)) root.dataset.mode = mode;
          var colors = { iris: [262,84,49,76], ember: [24,88,35,73], moss: [152,62,27,70], rose: [345,78,42,77], tide: [198,86,31,73], gold: [44,90,28,74] };
          var saved = JSON.parse(localStorage.getItem('accent') || 'null');
          var id = saved && colors[saved.id] ? saved.id : null;
          // First-ever visit: a random first impression, applied before first
          // paint so there is no flash. It is NOT saved — only a deliberate
          // choice in the theme dock is remembered. React reads the pick from
          // data-first-accent so both sides agree on the same colour.
          if (!id) {
            var ids = Object.keys(colors);
            id = ids[Math.floor(Math.random() * ids.length)];
            root.dataset.firstAccent = id;
          }
          var color = colors[id];
          root.style.setProperty('--ah', color[0]);
          root.style.setProperty('--as', color[1] + '%');
          root.style.setProperty('--accent-light', color[2] + '%');
          root.style.setProperty('--accent-dark', color[3] + '%');
          root.dataset.motion = localStorage.getItem('motion') === 'off' || matchMedia('(prefers-reduced-motion: reduce)').matches ? 'off' : 'on';
        } catch (error) {}
      })();
    </script>

roMDM, and SCEP[/hi] into one control plane, with a React interface in a shadcn-inspired language. Rollout is targeted for 2027, gated by testing, verification, and audits.",tech:[".NET 10","React","nanoMDM","microMDM","SCEP"],impact:["Rollout targeted across 1,000+ devices","One control plane over three MDM services","Initiative spanning CEO, CTO, accounting and monitoring teams"],flagship:!0},{id:"reporting",title:"Unified Reporting Engine",kind:"Microservice · Polyglot · AI-augmented",summary:"One Python service that replaced years of brittle reporting — now an analytics workspace.",description:"Every project reported its own way. I proposed and built a Python microservice whose API [ac]mirrors the underlying libraries directly[/ac] — no wrapper tax, no maintenance overhead. It has since grown into an analytics workspace: a Jupyter runtime embedded in the ERP, Gemini-assisted script generation, and a [hi]graph schema engine[/hi] where datasets inherit instead of duplicate. A 3,000+ case test suite keeps it honest.",tech:["Python 3.14","FastAPI","Jupyter kernel","Gemini API","Graph schemas","Pytest"],impact:["Replaced 5+ separate implementations","3,000+ automated tests, no regressions","Called a “marvel of engineering” by ACE leadership"],flagship:!0},{id:"evolver",title:"Evolver — Auto-Update Engine",kind:"Infrastructure · EMS · 1 month",summary:"Chromium-inspired, cross-platform updater with graceful rollback.",description:"IPC between the app and a dedicated updater, staged rollouts, error-resilient backups and recovery — on both Windows and macOS. A companion app handles on-demand updates; a deployment tool streamlines distribution.",tech:[".NET","C#","IPC","AvaloniaUI"],impact:["Zero failed updates","Deployment friction ≈ 0"]},{id:"jobs",title:"Background Jobs Framework",kind:"Infrastructure · Core",summary:"Job processing that other teams quietly adopted.",description:"Built for EMS out of necessity; proved solid enough that other teams ported it to fix the od:"Dec 2024 — Jul 2025",summary:"Built the UWB Indoor Positioning Simulation as a [hi]solo project[/hi] — accurate placement planning without [ac]costly physical testing[/ac].",highlights:["First-principles signal propagation modeling","Real-time NumPy/SciPy coverage heatmaps","Material-specific attenuation for walls and glass","Within 5% of physical test results"],tech:["C# 13",".NET 9","Python 3.13","NumPy","SciPy","WPF","Matplotlib"]},{company:"TeqHolic",role:"Flutter Development Intern",period:"2023 · 3 months",summary:"Two full MVPs — a real-time social app and a Shopify-backed store — optimized for low bandwidth.",highlights:["Chirp: real-time feeds and notifications","Sara Kuch: Shopify cart, checkout and tracking"],tech:["Flutter","Dart","Firebase","Shopify API"]}],UA=[{period:"Age 3 – 10",title:"The Genesis",text:"It started in Rawalpindi, in my uncle's computer lab. Then a PC of my own in Jhelum, with no internet and no English to lean on. Fixing Windows XP by trial and error turned a curious kid into a [hi]self-taught technician[/hi]."},{period:"Teenage years",title:"The Awakening",text:"A TV segment on ethical hacking set an impossible goal: reach an Android from another Android, with no real hardware. A year of Linux, Python and shell scripting later, that research became the [ac]2nd most-read Null Byte article[/ac] and a security community across 6 countries."},{period:"2019 – 2023",title:"The Academy",text:"3.73 CGPA at University of the Punjab, with every data structure implemented in modern C++ a year ahead of coursework — because [em]understanding beats memorization[/em]. Unofficial C++ TA from semester two, and the first team to ship a capstone and two papers together."},{period:"2023 – now",title:"The Craft",text:"An offer from Rev9's AI team became leverage in negotiation, and a direct selection at ACE won out for enterprise scale. One year on a single system, then a family of platforms — and the Reporting Engine, where [ac]Intelligent Scaffolding[/ac] stopped being a concept and went into production."}],Yt={quote:"The scale of the goal has [hi]never[/hi] mattered to me — what matters is the [ac]journey[/ac] of getting there.",restraint:"Design should be like seasoning — [hi]precise application[/hi] enhances, over-application ruins. Quiet zones give the eye a resting point so the accents can speak. [em]If everything is accented, nothing is.[/em]",transform:"Most software exists to [hi]remember[/hi]. What excites me is software that takes something [dim]in[/dim] and gives something [ac]genuinely new[/ac] back.",learning:"Sherlock Holmes called the mind an attic: finite, and ruined by hoarding. Rote facts are hoarding. [hi]Understanding[/hi] is a network — new ideas tied to what I already know, until forgetting becomes difficult. It is the one skill that [ac]improves every other skill[/ac] at the same time.",learningQuote:"Not learning to remember — learning to learn.",principles:[{title:"Beyond the recipe",text:"Challenge implementations until knowledge becomes intuition."},{title:"Precision",text:"Mastery shows in removing what doesn't belong."},{title:"Adaptability",text:"Each problem gets a solution shaped to its constraints."},{title:"Evolution",text:"Better, not just different — until it feels inevitable."}],discovery:{title:"Rediscovering Horner's Method",text:"Frustrated with binary-to-decimal arithmetic, I found my own trick: from the leftmost 1, move right — double, add the digit, repeat. Years later I learned it was Horner's Method. Intuition, validated."},fibonacci:{title:"The zero-branch Fibonacci",text:"The standard sequence checks for 0 and 1 on every single iteration. That bothered me enough to spend hours on paper with it.",points:["Project the sequence backward, into negative indices.","Start the generation there instead of at zero.","The conditional branch stops being needed at all."]},levels:[{level:"01",state:"Unconscious incompetence",line:"He who knows not, and knows not that he knows not, is a fool — shun him."},{level:"02",state:"Conscious incompetence",line:"He who knows not, and knows that he knows not, is hungry — teach him.",marker:"Where I stand"},{level:"03",state:"Unconscious competence",line:"He who knows, and knows not that he knows, is asleep — wake him."},{level:"04",state:"Conscious competence",line:"He who knows, and knows that he knows, is wise — follow him.",marker:"Where I'm heading"}],levelsNote:"Level two, honestly. Able to build robust, secure systems — and very aware of how much is still unknown. Level four is the goal: knowing deeply enough to architect systems that optimize and defend themselves. That gap is what keeps me working."},Pt={lead:"The industrial revolution automated manual labour. This one automates [hi]cognitive boilerplate[/hi] — and moves an engineer's value from implementation to orchestration, leaving more attention for architecture, security, and interface.",quote:"When machines automate the routine, the engineer becomes the orchestrator.",squad:"For the reporting engine's module presets, four specialists worked as one: frontend, backend, database-schema, and data. Each assembled part of the picture; together they produced the JSON schemas for multi-currency budgeting and the full procurement lifecycle.",story:{title:"The 100× pivot",text:"Bringing Cursor into an enterprise workflow took a deliberate campaign with the PMs, the CTO, and the CEO. Speed without standards would have been a liability, so the way I work changed with it:",points:["Write less boilerplate; spend the time on architecture instead.","Hold the quality line — review and correct every generated output.","Direct intelligence toward intent, rather than typing the result."]},outcomes:[{value:"100×",label:"faster deployment cycles"},{value:"3,000+",label:"tests guarding the engine"},{value:"2+ yrs",label:"working this way, daily"}],pipeline:["Incident","Ticket","Raise","Resolution","Report","Human review","Test suite","Deployment"],pipelin  or soon. But a person should aim at the horizon they actually believe in — and then do the nearest honest thing that points toward it.",next:"The nearest honest thing, for now: making trustworthy AI reach the people usually priced out of it — starting where I stand, in Pakistan."},YA=[{title:"The ARMA II traffic module",period:"Early teens",text:"Every custom mission needed tedious manual setup, so I decompiled a packaged addon, reverse-engineered its source, and refactored the bindings to embed a traffic script of my own. It repackaged cleanly and ran on the [hi]first launch[/hi].",note:"First contact with reverse engineering and binary-level thinking — the habit that later became a security career."},{title:"The monitoring proposal that didn't ship",period:"2024",text:"I proposed an AI-driven evolution of the Employee Monitoring Suite to automate worklogging and remove the trust problems manual monitoring creates. Built the plan with a colleague; the CTO backed the architecture. Commercial priorities pulled the team toward ERP instead, and it never materialised.",note:"A real failure, and a useful one. It validated the instinct — and sharpened the pull toward somewhere more research-oriented."}],PA=[{name:"Modern C++ Mastery with Game Development",issuer:"TheCherno",note:"Performance-focused engineering mentorship"},{name:"Advanced Cryptography",issuer:"Christof Paar",note:"Cryptographic theory and its implementation"},{name:"Flutter Development",issuer:"The App Brewery",note:"Cross-platform mobile development"},{name:".NET Basic to Advanced",issuer:"CodeWithMosh & Tim Corey",note:"Enterprise .NET patterns"},{name:"IELTS Academic",issuer:"British Council",note:"Band 7.5 · L 8.5 · R 7.0 · W 7.0 · S 7.0"}],Of=[{id:"mode",label:"Mixed mode",nav:"Mode",description:"The Ink & Paper experiment"},{id:"work",label:"Selected work",nav:"Work",description:"Enterprise systems and architecture"},{id:"orchestration",label:"Agentic engineering",nav:"Orchestration",description:" entralized Rules and Thresholds framework supports changes without scattering business policy across modules."},{title:"One schema, many forms",detail:"A JSON form engine generates theme-compliant interfaces from reusable definitions."},{title:"Navigation that knows your rights",detail:"A fuzzy-search command palette respects access control while making the platform easier to navigate."}],modules:[{name:"Permissions & Rights",detail:"Tenant-aware, module-agnostic access control, designed to be adopted in a few lines."},{name:"Approvals Orchestration",detail:"A generic approve, reject and escalate workflow layer any module can plug into."},{name:"Rules & Thresholds",detail:"Central policy engine driving approvals, restrictions, escalations and notifications."},{name:"Notifications & Templates",detail:"Email, in-app, push and WhatsApp delivery with runtime-managed, localizable templates."},{name:"Dynamic JSON Form Engine",detail:"Schema-driven interface generation that stays theme-compliant across modules."},{name:"Documents & Audit",detail:"Blob storage with time-bound links, plus action-level traceability for investigations."}]},reporting:{category:"Infrastructure",role:"Proposer, architect & lead engineer",period:"2025 – present",thesis:"Many systems. One reporting language.",challenge:"More than five services had independent, brittle reporting implementations. Output differed across products and customization was difficult. Finance teams needed ad-hoc analysis, audit trails, and bespoke visuals, but every request queued behind an engineering release.",approach:"A Python microservice consumed over HTTP by .NET, Angular and Laravel systems, with an API that stays close to ReportLab, OpenPyXL and Pandas instead of wrapping them. It then grew into an analytics workspace: an embedded Jupyter runtime, Gemini-assisted script generation, graph-based schema inheritance, immutable audit snapshots, and a large automated test suite.",decisions:[{title:"Choose the right ecosystem",detail:"Python's reporting and data libraries fit the problem better than forcing every task into the existing application language."},{title:"Let schemas inherit",detail:"Moving from rigid JSON definitions to a directed graph model removed duplication and saved the accounting team significant time."},{title:"Earn the speed with tests",detail:"Implementation was accelerated with AI agents, so a 3,000+ case suite exercises execution, graph resolution, sandboxing and renderers."},{title:"Let useful side projects escape",detail:"A visual-query stakeholder demo grew into SchemaFlow, now a standalone open-source tool."}],modules:[{name:"Embedded Jupyter runtime",detail:"Interactive Python execution inside the ERP, with notebook persistence, sharing and sandboxing — no local environment required."},{name:"Gemini script generation",detail:"Natural-language reporting requests become validated, executable Python analysis scripts."},{name:"Graph schema inheritance",detail:"A directed acyclic model where new reports inherit, extend and compose existing dataset pipelines."},{name:"Financial visualization presets",detail:"Treasury-ready components for cash flow, currency variance, liquidity and multi-year forecasting."},{name:"Frequency-based audit snapshots",detail:"Immutable point-in-time datasets captured on a schedule for regulatory and financial audits."},{name:"3,000+ test harness",detail:"Continuous pressure on the execution engine, graph resolution and output renderers under load."}]},overwatch:{category:"Security",role:"Architect & lead engineer",period:"2024 – present",thesis:"Configure the partner. Not the codebase.",challenge:"The legacy monitoring tool was hardcoded. Every new partner service meant code changes for headers, payloads, authentication and success criteria — so scaling it was effectively impossible, and maintenance never stopped.",approach:"Rebuilt from the ground up on .NET 10 and Blazor, at the CEO's request. Partner onboarding became a dynamic interface with encrypted header storage, custom authentication, and base URL overrides. A logical expression evaluator lets administrators define verification rules against JSON or XML responses without a deployment.",decisions:[{title:"Make verification expressible",detail:"Administrators compose rules over nested JSON and XML values using logical AND and OR blocks, instead of requesting new code."},{title:"Parse for scale",detail:"An optimized, on-demand response parser keeps large payload monitoring workable under load."},{title:"Rights down to the button",detail:"A module-agnostic rights engine controls individual actions, not just pages."},{title:"Keep the evidence",detail:"The analytics dashboard retains audit evidence down to the individual HTTP response received."}]},"apple-mdm":{category:"Infrastructure",role:"Architect & engineer",period:"Mid 2026 – rollout targeted 2027",thesis:"One control plane for a thousand machines.",challenge:"Deeper monitoring and hardware-level restriction could not be achieved with in-house tooling alone. Adopting Apple's MDM stack meant learning an entire unfamiliar ecosystem: enrollment flows, certificates, subscriptions and compliance obligations.",approach:"Months of research across the full Apple MDM lifecycle, securing the necessary rights and subscriptions and validating assumptions through trial and error. A .NET 10 backend acts as the single control plane over open-source MDM microservices, with a custom React interface in a shadcn-inspired visual language.",decisions:[{title:"Compose, don't reinvent",detail:"nanoMDM, microMDM and SCEP enrollment are orchestrated into one coherent platform rather than rebuilt."},{title:"Learn the ecosystem properly",detail:"Enrollment, certificates and compliance were studied end to end before committing to an architecture."},{title:"Gate the rollout",detail:"Company-wide deployment is staged behind testing, verification, compliance checks and audits."}]},uwb:{category:"Simulation",role:"Lead developer & system architect / solo",period:"December 2024 – July 2025",thesis:"Test the placement. Not the building.",challenge:"Validating UWB anchor placements required expensive physical installation and testing. Poor placements were costly to correct. MIMOS needed a way to explore coverage before committing to hardware.",approach:"Built a hybrid .NET and Python simulation. C# handles the interface, geometry, and core logic; NumPy and SciPy model signal propagation and produce coverage heatmaps. Material-specific attenuation accounts for walls, glass, and obstacles.",decisions:[{title:"Work from first principles",detail:"Signal propagation and computational geometry informed the model, rather than a purely visual approximation."},{title:"Make uncertainty visible",detail:"Layered coverage visualization helps users compare anchor configurations and locate weak areas."},{title:"Split at the natural boundary",detail:".NET provides the application shell; Python supplies the scientific-computing pipeline."}]},vault:{category:"Security",role:"Security architect & engineer",period:"2023",thesis:"Trust is designed in layers.",challenge:"Financial credentials required storage aligned with internal access policies, audit requirements, and key rotation. The system needed defense in depth, not just an encrypted database field.",approach:"Used established cryptographic primitives through OpenSSL, with C++ handling low-level operations and .NET providing application orchestration and the interface. The design combines layered encryption, auditing, key management, and zero-knowledge principles where applicable.",decisions:[{title:"Use established primitives",detail:"AES-256 and RSA-4096 form part of the design; bespoke application architecture does not require inventing cryptography."},{title:"Reduce the exposure surface",detail:"Credential handling, memory considerations, and access boundaries are treated as one security problem."},{title:"Make access accountable",detail:"Auditing and key rotation are built into the operational model."}]}},XN=[{title:"Identification of Paddy Disease Along Its Processing Time",category:"Co-authored research / 2023",publication:"Quantum Journal of Social Sciences and Humanities, 4(3), 72-80",href:"https://doi.org/10.55197/qjssh.v4i3.251"},{title:"Paddy Leaf Disease Symptoms Detection Through Artificial Neural Network",category:"Co-authored research / 2023",publication:"Quantum Journal of Engineering, Science and Technology, 4(4), 1-10",href:"https://qjoest.com/index.php/qjoest/article/view/123/75"},{title:"Quantum computing & photonics simulation",category:"Research collaboration / 2023 – 2024",publication:"C++, Python and MATLAB prototypes for mirror-array and emitter-detector setups, alongside a visiting PhD professor. She coached me on framing hypotheses and writing for publication; the modeling discipline carried directly into the MIMOS simulation work."},{title:"Notes from a hands-on security education",category:"Educational writing / Null Byte",publication:"Ten articles published as H4ck3R_777, including the 2nd and 8th most-read on the platform (2018–2020).",href:"https://creator.wonderhowto.com/h4ck3r_777/"},{title:"A forty-second fix for a lost save file",category:"Shared discovery / 2022",publication:"A power cut corrupted months of game progress with no fix online. Inspecting the save files revealed a numbered counterpart holding real data. The method still helps players across four titles.",href:"https://www.youtube.com/watch?v=cPH_SZKI_Cg"}],c1=new Set(["schemaflow","mr-crypt","schema-weaver","moire","letitgo","githubify"]),KN=new Set(["smart-cleanup","myportfolio"]),u1=n=>c1.has(n),QN=n=>c1.has(n)||KN.has(n);function tn({x:n,y:i,label:l,width:r=112}){return o.jsxs("g",{children:[o.jsx("rect",{x:n,y:i,width:r,height:"34",rx:"7",fill:"var(--plate)",stroke:"currentColor",strokeOpacity:".22"}),o.jsx("circle",{cx:n+13,cy:i+17,r:"2.5",fill:"var(--accent)"}),o.jsx("text",{x:n+24,y:i+21,fill:"cu
