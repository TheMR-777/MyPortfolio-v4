    <script>
      (function () {
        try {
          var root = document.documentElement;
          var mode = localStorage.getItem('mode');
          if (['light', 'mixed', 'dark'].includes(mode)) root.dataset.mode = mode;
          var colors = { iris: [262,84,49,76], ember: [24,88,35,73], moss: [152,62,27,70], rose: [345,78,42,77], tide: [198,86,31,73], gold: [44,90,28,74] };
          var saved = JSON.parse(localStorage.getItem('accent') || 'null');
          var color = saved && colors[saved.id];
          if (color) {
            root.style.setProperty('--ah', color[0]);
            root.style.setProperty('--as', color[1] + '%');
            root.style.setProperty('--accent-light', color[2] + '%');
            root.style.setProperty('--accent-dark', color[3] + '%');
          }
          root.dataset.motion = localStorage.getItem('motion') === 'off' || matchMedia('(prefers-reduced-motion: reduce)').matches ? 'off' : 'on';
        } catch (error) {}
      })();

lized Rules and Thresholds framework supports changes without scattering business policy across modules."},{title:"One schema, many forms",detail:"A JSON form engine generates theme-compliant interfaces from reusable definitions."},{title:"Navigation that knows your rights",detail:"A fuzzy-search command palette respects access control while making the platform easier to navigate."}]},reporting:{category:"Infrastructure",role:"Proposer & sole engineer",period:"2025 - present",thesis:"Many systems. One reporting language.",challenge:"More than five services had independent, brittle reporting implementations. Output differed across products, customization was difficult, and fixes had to be repeated in different codebases.",approach:"Created a Python microservice consumed through HTTP by .NET, Angular, and Laravel systems. ReportLab, OpenPyXL, and Pandas provide the underlying capabilities. The API stays close to those libraries, minimizing the custom wrapper surface to maintain.",decisions:[{title:"Choose the right ecosystem",detail:"Python's reporting and data-processing libraries offered a better fit than forcing every task into the existing application language."},{title:"Keep integration language-agnostic",detail:"A REST boundary gives every product the same path to PDF, Excel, and CSV output."},{title:"Let useful side projects escape",detail:"A visual-query stakeholder demo grew into SchemaFlow, now a standalone open-source tool."}]},uwb:{category:"Simulation",role:"Lead developer & system architect / solo",period:"December 2024 - July 2025",thesis:"Test the placement. Not the building.",challenge:"Validating UWB anchor placements required expensive physical installation and testing. Poor placements were costly to correct. MIMOS needed a way to explore coverage before committing to hardware.",approach:"Built a hybrid .NET and Python simulation. C# handles the interface, geometry, and core logic; NumPy and SciPy model signal propagation and produce coverage heatmaps. Material-specific attenuation accounts for walls, glass, and obstacles.",decisions:[{title:"Work from first principles",detail:"Signal propagation and computational geometry informed the model, rather than a purely visual approximation."},{title:"Make uncertainty visible",detail:"Layered coverage visualization helps users compare anchor configurations and locate weak areas."},{title:"Split at the natural boundary",detail:".NET provides the application shell; Python supplies the scientific-computing pipeline."}]},vault:{category:"Security",role:"Security architect & engineer",period:"2023",thesis:"Trust is designed in layers.",challenge:"Financial credentials required storage aligned with internal access policies, audit requirements, and key rotation. The system needed defense in depth, not just an encrypted database field.",approach:"Used established cryptographic primitives through OpenSSL, with C++ handling low-level operations and .NET providing application orchestration and the interface. The design combines layered encryption, auditing, key management, and zero-knowledge principles where applicable.",decisions:[{title:"Use established primitives",detail:"AES-256 and RSA-4096 form part of the design; bespoke application architecture does not require inventing cryptography."},{title:"Reduce the exposure surface",detail:"Credential handling, memory considerations, and access boundaries are treated as one security problem."},{title:"Make access accountable",detail:"Auditing and key rotation are built into the operational model."}]},"ace-status":{category:"Infrastructure",role:"Integration engine architect & engineer",period:"2024",thesis:"Configure the partner. Not the codebase.",challenge:"Each new partner needed a manual C# configuration file and custom request-response logic. Onboarding was slow, data relationships were inconsistent, and the audit trail was incomplete.",approach:"Rebuilt the system around a normalized EF Core data model and a dynamic request-response pipeline. Administrators can configure headers, request bodies, JSON/XML paths, and multi-rule validation without writing partner-specific C#.",decisions:[{title:"Normalize the configuration",detail:"Code-first database relationships replace manually maintained string associations."},{title:"Model verification explicitly",detail:"Nested JSON/XML fields can participate in AND, OR, and XOR rule combinations."},{title:"Keep the evidence",detail:"Reporting, export, and audit trails make integrations easier to operate and investigate."}]}},SN=[{title:"Identification of Paddy Disease Along Its Processing Time",category:"Co-authored research / 2023",publication:"Quantum Journal of Social Sciences and Humanities, 4(3), 72-80",href:"https://doi.org/10.55197/qjssh.v4i3.251"},{title:"Paddy Leaf Disease Symptoms Detection Through Artificial Neural Network",category:"Co-authored research / 2023",publication:"Quantum Journal of Engineering, Science and Technology, 4(4), 1-10",href:"https://qjoest.com/index.php/qjoest/article/view/123/75"},{title:"Notes from a hands-on security education",category:"Educational writing / Null Byte",publication:"Published as H4ck3R_777, exploring Linux, networking, and ethical security research.",href:"https://creator.wonderhowto.com/h4ck3r_777/"}];function mn({x:n,y:i,label:l,width:r=112}){return f.jsxs("g",{children:[f.jsx("rect",{x:n,y:i,width:r,height:"34",rx:"7",fill:"var(--plate)",stroke:"currentColor",strokeOpacity:".22"}),f.jsx("circle",{cx:n+13,cy:i+17,r:"2.5",fill:"var(--accent)"}),f.jsx("text",{x:n+24,y:i+21,fill:"currentColor",opacity:".75",children:l})]})}function Fv({id:n,className:i}){const l=z.useId().replace(/:/g,""),r=`${l}-dots`,u=`${l}-wash`,h=`${l}-floor`;return f.jsx("div",{className:mt("project-visual",i),"aria-hidden":"true",children:f.jsxs("svg",{viewBox:"0 0 600 220",fill:"none",children:[f.jsxs("defs",{children:[f.jsx("pattern",{id:r,width:"22",height:"22",patternUnits:"userSpaceOnUse",children:f.jsx("circle",{cx
